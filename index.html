<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ירוק בבית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="אפליקציה לטיפול בצמחי בית: משימות היום, זיהוי צמח מתמונה ותזכורות חכמות.">
<meta name="theme-color" content="#0d1a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ירוק בבית">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
/* VOICE everyday, premium
   IDEA frosted glass panes resting on a jungle: the app is a pane of glass you look through to the plants
   PICTURE the live phone app with real plant photos, glass cards, care ring and water meter
   COLOUR deep forest ground, white glass at 8-14%, sage-lime accent, warm sun yellow for warnings, water blue
   TYPE Heebo light for big titles, Heebo regular/medium for text
   LAYOUT laptop: jungle full-bleed, phone beside a glass panel of things to try; phone: app fills the screen, panel below */
:root{color-scheme:dark;--ground:#0d1a10;--ink:#f1f6ee;--mute:rgba(241,246,238,.66);--faint:rgba(241,246,238,.42);--glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.14);--edge:rgba(255,255,255,.18);--lime:#cfe8a6;--sage:#8fb57a;--deep:#16301d;--sun:#f3d36b;--water:#9fd0ff;--red:#ff9b85}
*{box-sizing:border-box;min-width:0}
html{background:var(--ground)}
body{background:linear-gradient(180deg,rgba(8,18,10,.35),rgba(8,18,10,.78)),url(img/bg.webp) center/cover fixed,var(--ground);min-height:100%;color:var(--ink);font:16px/1.55 "Heebo","Arial Hebrew",system-ui,sans-serif;overflow-x:clip;margin:0}
.band{padding-block:clamp(24px,4vw,56px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(24px,6vw,88px);align-items:center}
h1,h2,h3{line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance;font-weight:500}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-radius:22px}
.side{display:flex;flex-direction:column;gap:20px}
.side h1{font-size:clamp(44px,6vw,76px);font-weight:300;letter-spacing:-.03em}
.side h1 b{font-weight:600;display:block}
.side p{margin:0;max-width:46ch;color:var(--mute);font-size:17px}
.try{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:520px}
.try button{font:500 15px "Heebo",sans-serif;text-align:start;padding:12px 14px;border-radius:16px;border:1px solid transparent;background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px}
.try button:hover{background:rgba(255,255,255,.12);border-color:var(--edge)}
.try svg{width:20px;height:20px;flex:none;color:var(--lime)}
.note{font-size:14px;color:var(--faint)}
/* phone */
.phone{position:relative;width:100%;aspect-ratio:9/19.2;max-height:840px;border-radius:48px;padding:9px;background:linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.06));box-shadow:0 40px 80px -30px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.25)}
.screen{position:relative;height:100%;border-radius:40px;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
.screen::before{content:"";position:absolute;inset:-40px;background:url(img/bg.webp) center/cover;filter:blur(22px) brightness(.55) saturate(1.1);z-index:-1}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font:600 14px "Heebo",sans-serif;direction:ltr}
.status span:last-child{display:flex;gap:6px;align-items:center}
.status i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.view{flex:1;overflow-y:auto;padding:10px 18px 110px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*,.detail>*{flex-shrink:0}
.view svg,.detail svg{width:18px;height:18px;flex:none}
.tabs{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border-radius:26px;z-index:4;background:rgba(20,36,24,.45)}
.tabs button{border:0;background:none;color:var(--mute);font:500 12px "Heebo",sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer;border-radius:20px;min-height:52px}
.tabs button[aria-current=true]{color:var(--deep);background:var(--lime)}
.tabs svg{width:22px;height:22px}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.view,.detail{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top h2{font-size:30px;font-weight:300}
.top h2 b{font-weight:600}
.top small{color:var(--mute);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px "Heebo",sans-serif;padding:6px 11px;border-radius:999px;white-space:nowrap}
.chip.ok{background:rgba(207,232,166,.16);color:var(--lime)}
.chip.warn{background:rgba(243,211,107,.16);color:var(--sun)}
.chip.bad{background:rgba(255,155,133,.16);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:300 38px "Heebo",sans-serif;line-height:1}
.ring b small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:-14px}
.hero p{margin:0;color:var(--mute);font-size:14px}
.hero h3{font-size:18px;margin-bottom:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:500}
.sec button{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px;scroll-padding-inline:18px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 132px;scroll-snap-align:start;padding:8px 8px 12px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.mini img{width:100%;height:118px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.mini h3{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:999px}
.seg button{border:0;background:none;color:var(--mute);font:500 14px "Heebo",sans-serif;padding:8px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--lime);color:var(--deep)}
.task{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;transition:opacity .3s}
.task img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.task h3{font-size:16px;font-weight:500}
.task p{margin:2px 0 0;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:5px}
.task p svg{width:14px;height:14px;color:var(--water)}
.task.done h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.task.done{opacity:.6}
.check{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer;color:var(--deep)}
.check.on{background:var(--lime);border-color:var(--lime)}
.check svg{width:18px;height:18px}
.later{grid-column:2/-1;display:flex;gap:8px}
.ghost{flex:1;font:500 13px "Heebo",sans-serif;border-radius:12px;padding:7px 8px;border:1px solid var(--edge);background:rgba(255,255,255,.05);color:var(--ink);cursor:pointer}
.tip{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.tip h3{font-size:15px;margin-bottom:3px}
.tip p{margin:0;font-size:13px;color:var(--mute)}
.tip .big{font:300 30px "Heebo",sans-serif;color:var(--sun);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{padding:10px 10px 12px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px}
.pcard img{width:100%;height:130px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.pcard h3{font-size:15px}
.pcard small{color:var(--mute);font-size:12px;margin-top:-4px}
.meter{position:relative;height:8px;border-radius:9px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 5px);overflow:hidden}
.meter i{position:absolute;inset-block:0;right:0;border-radius:9px;background:linear-gradient(270deg,var(--water),#d7ecff)}
/* detail */
.detail{position:absolute;inset:0;z-index:6;background:rgba(10,22,13,.55);-webkit-backdrop-filter:blur(34px) saturate(130%);backdrop-filter:blur(34px) saturate(130%);overflow-y:auto;padding:0 18px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;animation:rise .35s ease}
.detail::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.dhead{display:flex;justify-content:space-between;padding-top:52px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.round svg{width:20px;height:20px}
.dstage{position:relative;min-height:250px;display:grid;grid-template-columns:minmax(0,1fr) 52%;align-items:end}
.dstage h2{font-size:32px;font-weight:600;align-self:start;padding-top:6px}
.dstage h2 small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin:6px 0 10px;font-style:italic;direction:ltr;text-align:right}
.dstage img{width:100%;height:270px;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(0,0,0,.45));margin-bottom:-16px}
.over{padding:14px}
.over h3{font-size:14px;color:var(--mute);font-weight:400;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.facts div{text-align:center;padding:4px 2px;border-inline-start:1px solid var(--edge);font-size:12px;color:var(--mute);line-height:1.3}
.facts div:first-child{border:0}
.facts svg{width:22px;height:22px;color:var(--lime);display:block;margin:0 auto 6px}
.facts b{display:block;color:var(--ink);font-size:13px;font-weight:500;margin-bottom:2px}
.level{padding:14px 16px}
.level .row{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}
.level .num{font:300 40px "Heebo",sans-serif;line-height:1}
.level .num small{font-size:16px}
.bar{position:relative;height:40px;border-radius:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1.5px,transparent 1.5px 5px)}
.bar i{position:absolute;inset-block:0;right:0;border-radius:12px;background:linear-gradient(270deg,var(--sun),#fff3bd)}
.bar i::after{content:"";position:absolute;left:-2px;top:-6px;bottom:-6px;width:2px;background:var(--sun)}
.hist{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;direction:ltr}
.hist i{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.08)}
.hist i.on{background:var(--water)}
.cta{display:flex;gap:10px}
.btn{flex:1;font:600 16px "Heebo",sans-serif;border-radius:18px;padding:14px;border:0;cursor:pointer;color:var(--deep);background:linear-gradient(90deg,var(--lime),var(--sage));display:flex;justify-content:center;align-items:center;gap:8px;min-height:52px}
.btn svg{width:18px;height:18px}
.btn.alt{flex:none;width:56px;background:var(--glass2);color:var(--ink);border:1px solid var(--edge)}
.btn:disabled{opacity:.4;cursor:default}
/* add */
.cam{position:relative;height:300px;border-radius:28px;overflow:hidden}
.cam::before{content:"";position:absolute;inset:0;background:url(img/bg.webp) center 70%/cover;filter:blur(6px) brightness(.7)}
.cam img{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:250px;filter:drop-shadow(0 16px 18px rgba(0,0,0,.5))}
.frame{position:absolute;inset:26px 36px;border-radius:24px;background:linear-gradient(var(--lime),var(--lime)) top right/26px 3px,linear-gradient(var(--lime),var(--lime)) top right/3px 26px,linear-gradient(var(--lime),var(--lime)) top left/26px 3px,linear-gradient(var(--lime),var(--lime)) top left/3px 26px,linear-gradient(var(--lime),var(--lime)) bottom right/26px 3px,linear-gradient(var(--lime),var(--lime)) bottom right/3px 26px,linear-gradient(var(--lime),var(--lime)) bottom left/26px 3px,linear-gradient(var(--lime),var(--lime)) bottom left/3px 26px;background-repeat:no-repeat}
.scan{position:absolute;left:36px;right:36px;height:2px;background:var(--lime);box-shadow:0 0 18px 4px rgba(207,232,166,.7);top:26px;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 28px)}}
.camhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.picks button{padding:6px;cursor:pointer;color:var(--ink);font:500 12px "Heebo",sans-serif;border-radius:16px}
.picks button[aria-pressed=true]{border-color:var(--lime);background:rgba(207,232,166,.12)}
.picks img{width:100%;height:58px;object-fit:contain}
.result{padding:16px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;gap:12px;align-items:center}
.rhead img{width:72px;height:72px;object-fit:contain}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.field input,.field select{font:16px "Heebo",sans-serif;padding:11px 12px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--ink)}
.field option{color:#000}
/* reminders */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px}
.set div{display:flex;flex-direction:column}
.set b{font-weight:500}
.set small{color:var(--mute);font-size:13px;line-height:1.35}
.sw{appearance:none;width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s}
.sw:checked{background:var(--sage)}.sw:checked::after{right:23px}
input[type=time]{font:500 18px "Heebo",sans-serif;border:1px solid var(--edge);border-radius:12px;padding:6px 10px;background:rgba(255,255,255,.06);color:var(--ink)}
.notif{position:absolute;top:10px;left:10px;right:10px;z-index:9;padding:12px 14px;border-radius:24px;background:rgba(30,46,34,.6);box-shadow:0 20px 40px -16px rgba(0,0,0,.6);transform:translateY(-150%);transition:transform .5s cubic-bezier(.2,1.25,.4,1)}
.notif.show{transform:none}
.nt{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.nt img{width:28px;height:28px;border-radius:8px;background:var(--lime);object-fit:contain;padding:2px}
.notif h3{font-size:15px;font-weight:600;margin:8px 0 2px}
.notif p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.notif .cta .btn{font-size:14px;padding:9px;min-height:40px;border-radius:14px}
.notif .ghost{border-radius:14px}
.toast{position:absolute;bottom:96px;left:50%;transform:translate(-50%,16px);font:500 14px "Heebo",sans-serif;padding:9px 16px;border-radius:99px;opacity:0;transition:.3s;white-space:nowrap;z-index:8;pointer-events:none;background:rgba(207,232,166,.92);color:var(--deep)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.scan,.detail{animation:none}.notif,.toast{transition:none}}
@media(max-width:800px){.wrap{grid-template-columns:minmax(0,1fr)}.phone{max-width:400px;margin:0 auto}.side{order:-1}.side h1{font-size:48px}}
@media(max-width:600px){
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ground)}
.band{padding:0;height:100%}
.wrap{display:block;height:100%}
.side{display:none}
.phone{max-width:none;width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;padding:0;background:none;box-shadow:none}
.screen{border-radius:0}
.status{display:none}
.view{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.tabs{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px))}
.notif{top:calc(env(safe-area-inset-top,0px) + 8px)}
.dhead{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.detail{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
}
.small{font:500 14px "Heebo",sans-serif;background:none;border:0;color:var(--faint);cursor:pointer;padding:10px;text-decoration:underline}
</style>
</head>
<body>
<div class="band">
<div class="wrap" dir="rtl" lang="he">
  <div class="phone"><div class="screen" id="screen">
    <div class="status"><span>9:41</span><span><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg><i aria-hidden="true"></i></span></div>
    <div class="notif glass" id="notif" role="status" aria-live="polite"></div>
    <main class="view" id="view"></main>
    <div class="toast" id="toast"></div>
    <nav class="tabs glass" id="tabs"></nav>
  </div></div>

  <section class="side">
    <h1>ירוק<b>בבית</b></h1>
    <p>אפליקציה שמזכירה לך לטפל בצמחים בזמן, מזהה צמח מתמונה, ולומדת את הקצב של כל אחד מהם.</p>
    <div class="try glass">
      <button id="t-notif"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg>שלח תזכורת לדוגמה</button>
      <button id="t-plant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21V11C12 6 8 4 4 4c0 5 3 7 8 7zm0 0c0-4 3-7 8-7 0 4-3 7-8 7z"/></svg>פתח כרטיס צמח</button>
      <button id="t-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>הוסף צמח בצילום</button>
      <button id="t-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>אפס את הדוגמה</button>
    </div>
    <p class="note">הצמחים, מזג האוויר והזיהוי הם דוגמה. השינויים נשמרים רק בדפדפן שלך.</p>
  </section>
</div>
</div>

<script>
{
const T={
 monstera:{sp:'מונסטרה',lat:'Monstera deliciosa',every:7,light:'בהיר עקיף',temp:'18–27°',hum:'60–80%',tip:'נגב את העלים מאבק פעם בשבועיים, כדי שינשמו ויקלטו אור.'},

function water(id,how){

}

 <div class="seg glass" role="group" aria-label="סינון משימות"><button data-seg="today" aria-pressed="${S.seg==='today'}">היום</button><button data-seg="up" aria-pressed="${S.seg==='up'}">בקרוב</button><button data-seg="done" aria-pressed="${S.seg==='done'}">בוצע</button></div>
 ${segList.length?segList.map(p=>{const d=S.done[p.id];const isToday=S.seg==='today';return `<article class="task glass ${d?'done':''}">
  <img src="${img(p.type)}" alt="">
  <div><h3>${d==='ok'||isToday?'השקיה':'השקיה'} · ${esc(p.name)}</h3><p>${svg('drop')}${d==='ok'?'הושקה היום':d==='wet'?'נדחה, האדמה רטובה':d==='later'?'נדחה למחר':isToday?esc(p.room):when(p)}</p></div>
  ${isToday?`<button class="check" data-w="${p.id}" aria-label="סמן שהשקית את ${esc(p.name)}">${svg('check',2.4)}</button>`:d?`<span class="check on">${svg('check',2.4)}</span>`:`<span class="chip glass" style="border:0">${when(p)}</span>`}
  ${isToday?`<div class="later"><button class="ghost" data-wet="${p.id}">עדיין רטוב</button><button class="ghost" data-later="${p.id}">דחה למחר</button></div>`:''}
 </article>`}).join(''):`<p class="note" style="text-align:center;margin:8px 0">${S.seg==='today'?'אין עוד משימות להיום':S.seg==='done'?'עוד לא סימנת משימות היום':'אין משימות קרובות'}</p>`}
 ${S.remind.weather?`<div class="tip glass"><div><h3>גל חום מחר</h3><p>כדאי להשקות את קוצי ואת שרי הערב, גם אם עוד לא הגיע הזמן.</p></div><span class="big">29°</span></div>`:''}`;

function detail(){
 const p=S.plants.find(x=>x.id===sel);if(!p)return '';
 const t=I(p),[c,st]=state(p),L=Math.round(lvl(p)*100);

 return `<div class="detail" role="dialog" aria-label="${esc(p.name)}">
  <div class="dhead"><button class="round glass" data-close aria-label="חזרה">${svg('back',2)}</button><button class="round glass" aria-label="עוד">${svg('more',2)}</button></div>

function add(){
 const picks=['monstera','lily','snake','fern'];
 if(A.stage===2){const t=T[A.pick];return `<div class="top"><h2><b>זיהינו את הצמח</b></h2></div>

 <div class="cam glass">${A.pick?`<img src="${img(A.pick)}" alt="">`:''}<div class="frame"></div>${A.stage?'<div class="scan"></div>':''}${A.pick?'':'<span class="camhint chip glass" style="border:0">כוון את המצלמה לצמח</span>'}</div>
 <div class="picks">${picks.map(k=>`<button class="glass" data-pick="${k}" aria-pressed="${A.pick===k}"><img src="${img(k)}" alt="">${T[k].sp}</button>`).join('')}</div>

function reminders(){
 const R=S.remind,sw=(k,t,s)=>`<label class="set glass" for="r-${k}"><div><b>${t}</b><small>${s}</small></div><input type="checkbox" class="sw" id="r-${k}" data-r="${k}" ${R[k]?'checked':''}></label>`;
 return `<div class="top"><h2><b>תזכורות</b></h2></div>

 ${sw('push','התראות בטלפון','התראה אמיתית במכשיר. באייפון, אחרי הוספה למסך הבית')}
 ${sw('combine','התראה מרוכזת','במקום התראה נפרדת לכל צמח')}

const TABS=[['today','היום','M4 11l8-7 8 7v9H4zM10 20v-5h4v5'],['plants','הצמחים','M12 21V11C12 6 8 4 4 4c0 5 3 7 8 7zm0 0c0-4 3-7 8-7 0 4-3 7-8 7z'],['add','הוספה','M12 5v14M5 12h14'],['remind','תזכורות','M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4']];

 const v=$('view'),y=v.scrollTop;
 v.innerHTML=S.tab==='today'?today():S.tab==='plants'?plants():S.tab==='add'?add():reminders();
 v.scrollTop=y;

function notify(){
 const open=S.plants.filter(p=>due(p)&&!S.done[p.id]),n=$('notif');
 const first=open[0];
 n.innerHTML=`<div class="nt"><img src="${img('monstera')}" alt=""><span>ירוק בבית · עכשיו</span></div>
  <h3>${open.length?(S.remind.combine?`${open.length===1?'צמח אחד צמא':open.length+' צמחים צמאים'} היום`:`${esc(first.name)}: אני קצת צמא`):'אין משימות היום'}</h3>
  <p>${open.length?esc(S.remind.combine?open.map(p=>p.name).join(', '):'הגיע הזמן להשקות אותי'):'כל הצמחים מרגישים מצוין.'}</p>
  ${open.length?`<div class="cta"><button class="btn" data-nall>השקיתי${open.length>1&&S.remind.combine?' הכל':''}</button><button class="ghost" data-nlater>דחה למחר</button></div>`:''}`;
 if(S.remind.push&&open.length)systemNotify(n.querySelector('h3').textContent,n.querySelector('p').textContent);
 n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),8000);

async function systemNotify(title,body){
 try{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const reg=await navigator.serviceWorker?.getRegistration();
  const opts={body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'daily',lang:'he',dir:'rtl'};
  if(reg)reg.showNotification(title,opts);else new Notification(title,opts);
 }catch(e){}
}
async function askPush(){
 if(!('Notification' in window)){toast('הדפדפן הזה לא תומך בהתראות');return false}
 try{const r=await Notification.requestPermission();if(r==='granted'){toast('ההתראות הופעלו');return true}}catch(e){}
 toast('אין הרשאה להתראות במכשיר הזה');return false;
}
const closeN=()=>$('notif').classList.remove('show');
const openDue=()=>S.plants.filter(p=>due(p)&&!S.done[p.id]);

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab){S.tab=d.tab;sel=null;$('view').scrollTop=0;save();render()}
 else if(d.seg){S.seg=d.seg;save();render()}
 else if(d.w){sel=null;water(+d.w,'ok')}
 else if(d.wet)water(+d.wet,'wet');
 else if(d.later)water(+d.later,'later');
 else if(d.open){sel=+d.open;render()}
 else if('close' in d){sel=null;render()}
 else if(d.del){S.plants=S.plants.filter(p=>p.id!==+d.del);sel=null;save();render();toast('הצמח הוסר')}
 else if(d.pick){A={pick:d.pick,stage:0};render()}
 else if('scan' in d){A.stage=1;render();setTimeout(()=>{A.stage=2;render()},1700)}
 else if('again' in d){A={pick:null,stage:0};render()}
 else if('save' in d){const t=A.pick;S.plants.push({id:S.next++,name:$('nm').value.trim()||T[t].sp,type:t,room:$('rm').value,last:0});A={pick:null,stage:0};S.tab='plants';save();render();toast(`נוסף. תזכורת ראשונה בעוד ${T[t].every} ימים`)}
 else if('demo' in d)notify();
 else if('reset' in d)reset();
 else if('nall' in d){openDue().forEach(p=>{p.last=0;S.done[p.id]='ok'});closeN();save();render();toast(S.remind.shared?'סומן לכל בני הבית':'סומן כהושקה')}
 else if('nlater' in d){openDue().forEach(p=>{p.last=I(p).every-1;S.done[p.id]='later'});closeN();save();render();toast('נזכיר מחר ב-'+S.remind.time)}
});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.r==='push'&&t.checked&&!(await askPush())){t.checked=false;return}if(t.dataset.r){S.remind[t.dataset.r]=t.checked;save();render()}else if(t.id==='r-time'){S.remind.time=t.value;save()}});
$('t-notif').onclick=()=>{sel=null;S.tab='today';render();notify()};
