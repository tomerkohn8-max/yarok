<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ירוק בבית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="אפליקציה לטיפול בצמחי בית: משימות היום, זיהוי צמח מתמונה ותזכורות חכמות.">
<meta name="theme-color" content="#e8f0e3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ירוק בבית">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap">
<style>
/* VOICE everyday, calm, premium
   IDEA light Liquid Glass over a sunlit jungle: clear panes with crisp white rims, things gently alive
   PICTURE the live phone app: real plant photos, glass cards, a lens that slides in the tab bar
   COLOUR pale leaf ground, white glass at ~45%, lime for fills, deep leaf green for accent text, water blue, sun amber
   TYPE Heebo light for big titles, Heebo regular/medium for text
   LAYOUT laptop: jungle full-bleed, phone beside a glass panel of things to try; phone: the app fills the screen */
:root{color-scheme:light;--ground:#e8f0e3;--ink:#14261a;--mute:rgba(20,38,26,.62);--faint:rgba(20,38,26,.4);--edge:rgba(20,60,30,.12);--lime:#afec4f;--sage:#8ccf3a;--leaf:#2f7d14;--deep:#16301d;--sun:#b07d00;--sunfill:#f3d36b;--water:#3d9be9;--red:#c2412a;
 --rim:inset 0 0 0 1px rgba(255,255,255,.6),inset 1.5px 1.5px 1px -.5px #fff,inset -1px -1px 1px -.5px rgba(255,255,255,.85),inset 0 -10px 18px -12px rgba(20,60,30,.14);
 --lift:0 14px 34px -18px rgba(20,60,30,.4);
 --spring:cubic-bezier(.3,1.6,.5,1)}
*{box-sizing:border-box;min-width:0}
html{background:var(--ground)}
body{background:linear-gradient(180deg,rgba(242,249,238,.5),rgba(226,239,219,.72)),url(img/bg.webp) center/cover fixed,var(--ground);min-height:100%;color:var(--ink);font:16px/1.55 "Heebo","Arial Hebrew",system-ui,sans-serif;overflow-x:clip;margin:0}
.band{padding-block:clamp(24px,4vw,56px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(24px,6vw,88px);align-items:center}
h1,h2,h3{line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance;font-weight:500}
/* the glass: clear, bright rim, soft lift */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.34));-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-radius:26px;box-shadow:var(--rim),var(--lift)}
.glass:not(.tabs):not(.notif):not(.camhint){position:relative}
/* neutral glass buttons, like a pebble of glass */
.ghost,.round,.check,.btn.alt,.try button{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.32));box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 1.5px 1px #fff,inset 0 -2px 4px rgba(20,60,30,.12),0 6px 14px -8px rgba(20,60,30,.35);border:0;color:var(--ink)}
button.glass,.btn,.ghost,.check,.round,.pill,.try button{transition:transform .5s var(--spring),background .25s,box-shadow .25s}
button.glass:active,.btn:active,.ghost:active,.check:active,.round:active,.pill:active,.try button:active{transform:scale(.94)}
.side{display:flex;flex-direction:column;gap:20px}
.side h1{font-size:clamp(44px,6vw,76px);font-weight:300;letter-spacing:-.03em}
.side h1 b{font-weight:600;display:block}
.side p{margin:0;max-width:46ch;color:var(--mute);font-size:17px}
.try{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:520px}
.try button{font:500 15px "Heebo",sans-serif;text-align:start;padding:12px 16px;border-radius:999px;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px}
.try svg{width:20px;height:20px;flex:none;color:var(--leaf)}
.note{font-size:14px;color:var(--faint)}
/* phone */
.phone{position:relative;width:100%;aspect-ratio:9/19.2;max-height:840px;border-radius:50px;padding:9px;background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.35));box-shadow:0 40px 80px -30px rgba(20,60,30,.55),inset 0 0 0 1px rgba(255,255,255,.9)}
.screen{position:relative;height:100%;border-radius:42px;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
.screen::before{content:"";position:absolute;inset:-40px;background:linear-gradient(rgba(240,248,236,.5),rgba(228,241,222,.66)),url(img/bg.webp) center/cover;filter:blur(26px) saturate(1.2) brightness(1.04);z-index:-2}
/* slow drifting light, so the glass always has something alive behind it */
.screen::after{content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(32% 24% at 22% 18%,rgba(175,236,79,.38),transparent 70%),radial-gradient(30% 22% at 80% 52%,rgba(255,255,255,.75),transparent 70%),radial-gradient(28% 24% at 30% 86%,rgba(120,200,160,.3),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(6%,-4%) rotate(8deg)}100%{transform:translate(-5%,5%) rotate(-6deg)}}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font:600 14px "Heebo",sans-serif;direction:ltr}
.status span:last-child{display:flex;gap:6px;align-items:center}
.status i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.view{flex:1;overflow-y:auto;padding:10px 18px 110px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*,.detail>*{flex-shrink:0}
.view svg,.detail svg{width:18px;height:18px;flex:none}
/* tab bar + sliding lens */
.tabs{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border-radius:999px;z-index:4;background:rgba(255,255,255,.38);-webkit-backdrop-filter:blur(10px) saturate(190%);backdrop-filter:blur(10px) saturate(190%);box-shadow:var(--rim),0 16px 36px -14px rgba(20,60,30,.45);touch-action:none;user-select:none;-webkit-user-select:none}
.tabs.refract{-webkit-backdrop-filter:url(#lg-bar) blur(4px) saturate(190%);backdrop-filter:url(#lg-bar) blur(4px) saturate(190%)}
.lens{position:absolute;top:6px;bottom:6px;left:6px;width:60px;border-radius:999px;pointer-events:none;z-index:0;background:radial-gradient(120% 140% at 50% 55%,rgba(175,236,79,.55),rgba(175,236,79,.18) 70%),rgba(255,255,255,.35);-webkit-backdrop-filter:blur(2px) saturate(220%);backdrop-filter:blur(2px) saturate(220%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 1.5px 1.5px 1px -.5px #fff,inset -1.5px -1.5px 1px -.5px rgba(255,255,255,.9),inset 0 -3px 6px rgba(60,120,20,.18),0 6px 16px -6px rgba(60,120,20,.45);transform-origin:center;transition:transform .5s var(--spring),background .3s}
.tabs.refract .lens{-webkit-backdrop-filter:url(#lg-lens) saturate(220%);backdrop-filter:url(#lg-lens) saturate(220%)}
.lens::before{content:"";position:absolute;left:12%;right:12%;top:2px;height:42%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.tabs.drag .lens{transform:scale(1.22,1.16);background:rgba(255,255,255,.18)}
.tabs button{position:relative;z-index:1;transition:color .3s;border:0;background:none;color:var(--mute);font:500 12px "Heebo",sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer;border-radius:20px;min-height:52px}
.tabs button[aria-current=true]{color:var(--deep)}
.tabs.drag button{color:var(--mute)}
.tabs svg{width:22px;height:22px}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.view,.detail{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h2{font-size:30px;font-weight:300}
.top h2 b{font-weight:600}
.top small{color:var(--mute);font-size:14px}
/* logo inside a slowly turning iridescent ring, like the "Ask agents" bubble */
.halo{position:relative;flex:none;width:48px;height:48px;border-radius:50%;padding:2.5px;overflow:hidden;box-shadow:0 6px 16px -6px rgba(20,60,30,.5)}
.halo::before{content:"";position:absolute;inset:-30%;background:conic-gradient(#fff,#c9f7ff,#ffd6f3,#fff4b8,#d4ffb8,#fff);animation:turn 7s linear infinite}
.halo img{position:relative;display:block;width:100%;height:100%;border-radius:50%}
.side .halo{width:76px;height:76px;padding:3px}
@keyframes turn{to{transform:rotate(1turn)}}
.logo{width:44px;height:44px;border-radius:14px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px "Heebo",sans-serif;padding:6px 11px;border-radius:999px;white-space:nowrap}
.chip.ok{background:rgba(140,207,58,.2);color:var(--leaf)}
.chip.warn{background:rgba(240,190,40,.22);color:#8a5d00}
.chip.bad{background:rgba(220,80,50,.15);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.bad .dot{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.6);opacity:.6}}
/* hero ring */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:18px}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:300 38px "Heebo",sans-serif;line-height:1}
.ring b small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:-14px}
.hero p{margin:0;color:var(--mute);font-size:14px}
.hero h3{font-size:18px;margin-bottom:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.sec button{background:none;border:0;color:var(--leaf);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
/* plant strip */
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:4px 18px 8px;scroll-padding-inline:18px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 128px;scroll-snap-align:start;padding:8px 8px 12px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.mini img{width:100%;height:112px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(20,50,25,.25))}
.mini h3{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* plants breathe a little */
.mini img:not(.ph),.pcard img:not(.ph),.dstage img:not(.ph){animation:bob 6s ease-in-out infinite;transform-origin:50% 100%}
.mini:nth-child(2n) img,.pcard:nth-child(2n) img{animation-delay:-2s}
.mini:nth-child(3n) img,.pcard:nth-child(3n) img{animation-delay:-4s}
@keyframes bob{50%{transform:translateY(-3px) rotate(.6deg)}}
/* segmented control */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px;border-radius:999px}
.seg button{border:0;background:none;color:var(--mute);font:500 14px "Heebo",sans-serif;padding:9px;border-radius:999px;cursor:pointer;transition:background .35s,color .3s,box-shadow .3s,transform .5s var(--spring)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.45));color:var(--deep);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),inset 0 1.5px 1px #fff,inset 0 -2px 4px rgba(20,60,30,.1),0 6px 14px -8px rgba(20,60,30,.4)}
.seg button:active{transform:scale(.94)}
/* tasks */
.task{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;transition:opacity .3s}
.task img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(20,50,25,.25))}
.task h3{font-size:16px;font-weight:500}
.task p{margin:2px 0 0;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:5px}
.task p svg{width:14px;height:14px;color:var(--water)}
.task.done h3{text-decoration:line-through;text-decoration-color:var(--faint)}
.task.done{opacity:.62}
.check{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--mute)}
.check.on{background:linear-gradient(180deg,#c4f56e,#a2e042);color:var(--deep);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),inset 0 1.5px 1px #fff,0 6px 14px -8px rgba(80,140,20,.7)}
.check.on svg{animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(.3)}}
.check svg{width:18px;height:18px}
.check[data-shoot]{color:var(--leaf)}
.later{grid-column:2/-1;display:flex;gap:8px}
.ghost{flex:1;font:500 13px "Heebo",sans-serif;border-radius:999px;padding:8px 10px;cursor:pointer}
.tip{padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.tip h3{font-size:15px;margin-bottom:3px}
.tip p{margin:0;font-size:13px;color:var(--mute)}
.tip .big{font:300 30px "Heebo",sans-serif;color:var(--sun);white-space:nowrap}
.txt{margin:0;font-size:14px;line-height:1.6;color:var(--ink)}
.todo{display:flex;flex-direction:column;gap:6px}
.todoi{display:flex;align-items:center;gap:10px;text-align:start;background:none;border:0;color:var(--ink);font:400 14px "Heebo",sans-serif;padding:4px 0;cursor:pointer}
.todoi .check{width:28px;height:28px;flex:none}
.todoi .check svg{width:14px;height:14px}
.todoi.on{color:var(--faint);text-decoration:line-through}
/* attention list */
.attn{display:flex;flex-direction:column;gap:8px;padding:14px}
.attn h3{font-size:15px;font-weight:600}
.attn button{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:rgba(255,255,255,.4);border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);border-radius:18px;padding:6px 10px;color:var(--ink);font:inherit;text-align:start;cursor:pointer}
.attn img{width:40px;height:40px;object-fit:contain}
.attn small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
/* photos */
img.ph{object-fit:cover!important;border-radius:16px;filter:none!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dstage img.ph{height:250px;border-radius:28px;margin-bottom:0;box-shadow:0 18px 30px -16px rgba(20,50,25,.5)}
/* pill with a glass icon bubble and an iridescent rim */
.pill{display:inline-flex;align-items:center;gap:8px;font:500 13px "Heebo",sans-serif;padding:4px 14px 4px 5px;border-radius:999px;border:0;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.35));box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 1.5px 1px #fff,0 6px 14px -8px rgba(20,60,30,.4)}
.pill .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--lime);background:radial-gradient(circle,#1f3d27 0 60%,transparent 62%),conic-gradient(#fff,#c9f7ff,#ffd6f3,#fff4b8,#d4ffb8,#fff)}
.pill svg{width:15px!important;height:15px!important}
.jr{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.jr figure,.ba figure{margin:0;position:relative;flex:none}
.jr img{width:78px;height:96px;object-fit:cover;border-radius:16px;display:block}
.jr figcaption,.ba figcaption{font-size:12px;color:var(--mute);text-align:center;margin-top:3px}
.jdel{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:var(--ink);font-size:11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ba img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:20px;display:block}
/* plant grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{padding:10px 10px 12px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px}
.pcard img{width:100%;height:130px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(20,50,25,.25))}
.pcard h3{font-size:15px}
.pcard small{color:var(--mute);font-size:12px;margin-top:-4px}
.meter{position:relative;height:7px;border-radius:9px;background:rgba(20,60,30,.1);overflow:hidden}
.meter i{position:absolute;inset-block:0;right:0;border-radius:9px;background:linear-gradient(270deg,var(--water),#a8d8ff)}
/* detail sheet */
.detail{position:absolute;inset:0;z-index:6;background:rgba(238,246,234,.62);-webkit-backdrop-filter:blur(34px) saturate(150%);backdrop-filter:blur(34px) saturate(150%);overflow-y:auto;padding:0 18px 24px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;animation:rise .6s cubic-bezier(.25,.8,.35,1)}
.detail::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.94);filter:blur(14px);border-radius:48px}60%{opacity:1;filter:blur(0)}80%{transform:translateY(-4px) scale(1.01)}to{transform:none}}
.dhead{display:flex;justify-content:space-between;padding-top:52px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.round svg{width:20px;height:20px}
.dstage{position:relative;min-height:250px;display:grid;grid-template-columns:minmax(0,1fr) 52%;align-items:end}
.dstage h2{font-size:32px;font-weight:600;align-self:start;padding-top:6px}
.dstage h2 small{display:block;font-size:14px;font-weight:400;color:var(--mute);margin:6px 0 10px;font-style:italic;direction:ltr;text-align:right}
.dstage img{width:100%;height:270px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(20,50,25,.3));margin-bottom:-16px}
.over{padding:16px}
.over h3{font-size:14px;color:var(--mute);font-weight:500;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.facts div{text-align:center;padding:4px 2px;border-inline-start:1px solid var(--edge);font-size:12px;color:var(--mute);line-height:1.3}
.facts div:first-child{border:0}
.facts svg{width:22px;height:22px;color:var(--leaf);display:block;margin:0 auto 6px}
.facts b{display:block;color:var(--ink);font-size:13px;font-weight:500;margin-bottom:2px}
.level{padding:16px}
.level .row{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}
.level .num{font:300 40px "Heebo",sans-serif;line-height:1}
.level .num small{font-size:16px}
.bar{position:relative;height:36px;border-radius:999px;background:repeating-linear-gradient(90deg,rgba(20,60,30,.12) 0 1.5px,transparent 1.5px 5px);overflow:hidden}
.bar i{position:absolute;inset-block:0;right:0;border-radius:999px;background:linear-gradient(270deg,var(--sunfill),#fff6cf);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.hist{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;direction:ltr}
.hist i{aspect-ratio:1;border-radius:5px;background:rgba(20,60,30,.08)}
.hist i.on{background:var(--water)}
.cta{display:flex;gap:10px}
/* primary: a lime drop of glass with a light sweep passing through */
.btn{position:relative;overflow:hidden;flex:1;font:600 16px "Heebo",sans-serif;border-radius:999px;padding:14px;border:0;cursor:pointer;color:var(--deep);background:linear-gradient(180deg,#c9f777,#a2e042);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 2px 1px rgba(255,255,255,.9),inset 0 -3px 6px rgba(60,120,20,.25),0 12px 24px -12px rgba(80,140,20,.75);display:flex;justify-content:center;align-items:center;gap:8px;min-height:52px}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.btn svg{width:18px;height:18px}
.btn.alt{flex:none;width:56px}
.btn.alt::after{display:none}
.btn:disabled{opacity:.45;cursor:default}
/* add */
.cam{position:relative;height:300px;border-radius:30px;overflow:hidden}
.cam::before{content:"";position:absolute;inset:0;background:url(img/bg.webp) center 70%/cover;filter:blur(6px) brightness(.95)}
.cam img{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:250px;filter:drop-shadow(0 16px 18px rgba(0,0,0,.35))}
.frame{position:absolute;inset:26px 36px;border-radius:24px;background:linear-gradient(#fff,#fff) top right/26px 3px,linear-gradient(#fff,#fff) top right/3px 26px,linear-gradient(#fff,#fff) top left/26px 3px,linear-gradient(#fff,#fff) top left/3px 26px,linear-gradient(#fff,#fff) bottom right/26px 3px,linear-gradient(#fff,#fff) bottom right/3px 26px,linear-gradient(#fff,#fff) bottom left/26px 3px,linear-gradient(#fff,#fff) bottom left/3px 26px;background-repeat:no-repeat}
.scan{position:absolute;left:36px;right:36px;height:2px;background:var(--lime);box-shadow:0 0 18px 4px rgba(175,236,79,.8);top:26px;animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 28px)}}
.camhint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);white-space:nowrap}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.picks button{padding:6px;cursor:pointer;color:var(--ink);font:500 12px "Heebo",sans-serif;border-radius:18px}
.picks button[aria-pressed=true]{box-shadow:var(--rim),0 0 0 2px var(--lime)}
.picks img{width:100%;height:58px;object-fit:contain}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kinds button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 12px;border:0;cursor:pointer;color:var(--ink);font:500 13px "Heebo",sans-serif;text-align:center;border-radius:22px}
.kinds img{width:100%;height:72px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(20,50,25,.22))}
.kinds img[src$="logo-mark.png"]{height:72px;padding:14px;opacity:.55;filter:none}
.kinds .plus{width:100%;height:72px;display:grid;place-items:center;font:200 44px "Heebo",sans-serif;color:var(--leaf)}
img[src$="logo-mark.png"]{opacity:.45;filter:none!important;animation:none!important;object-fit:contain;padding:12%}
.dstage img[src$="logo-mark.png"]{height:180px;align-self:center;margin:0}
.thumb{width:56px;height:56px;border-radius:18px;object-fit:cover;box-shadow:var(--rim),var(--lift)}
.cam img.ph{position:absolute;inset:0;width:100%;height:100%;transform:none;left:0;bottom:0;border-radius:0}
.cam{cursor:pointer}
.rhead img.ph{border-radius:18px}
.result{padding:16px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;gap:12px;align-items:center}
.rhead img{width:72px;height:72px;object-fit:contain}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.field input,.field select{font:16px "Heebo",sans-serif;padding:11px 14px;border-radius:16px;border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 2px 4px rgba(20,60,30,.08);background:rgba(255,255,255,.55);color:var(--ink)}
/* reminders */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px}
.set div{display:flex;flex-direction:column}
.set b{font-weight:500}
.set small{color:var(--mute);font-size:13px;line-height:1.35}
/* switch: green track, the knob turns into a clear lens while pressed */
.sw{appearance:none;-webkit-appearance:none;width:56px;height:32px;border-radius:999px;background:rgba(20,60,30,.14);box-shadow:inset 0 1px 3px rgba(20,60,30,.18);position:relative;cursor:pointer;flex:none;transition:background .3s;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:34px;height:26px;border-radius:999px;background:linear-gradient(180deg,#fff,#f1f5ee);box-shadow:0 3px 8px rgba(20,60,30,.28),inset 0 1px 0 #fff;transition:right .55s var(--spring),transform .45s var(--spring),background .25s,box-shadow .25s}
.sw:checked{background:linear-gradient(180deg,#9fe25a,#7cc93a)}
.sw:checked::after{right:19px}
.sw:active::after{transform:scale(1.32,1.38);background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.95),inset 2px 2px 3px rgba(255,255,255,.9),inset -2px -3px 5px rgba(20,60,30,.25),0 6px 14px rgba(20,60,30,.25)}
input[type=time]{font:500 18px "Heebo",sans-serif;border:0;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),inset 0 2px 4px rgba(20,60,30,.08);color:var(--ink)}
/* in-app notification */
.notif{position:absolute;top:10px;left:10px;right:10px;z-index:9;padding:12px 14px;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.6));box-shadow:var(--rim),0 20px 40px -16px rgba(20,60,30,.45);transform:translateY(-150%) scale(.92);transition:transform .6s cubic-bezier(.2,1.3,.4,1)}
.notif.show{transform:none}
.nt{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.nt img{width:28px;height:28px;border-radius:8px;object-fit:cover}
.notif h3{font-size:15px;font-weight:600;margin:8px 0 2px}
.notif p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.notif .cta .btn{font-size:14px;padding:9px;min-height:40px}
.toast{position:absolute;bottom:96px;left:50%;transform:translate(-50%,16px) scale(.9);font:500 14px "Heebo",sans-serif;padding:10px 18px;border-radius:99px;opacity:0;transition:opacity .3s,transform .5s var(--spring);white-space:nowrap;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.75));box-shadow:var(--rim),0 10px 24px -10px rgba(20,60,30,.5);color:var(--deep)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.small{font:500 14px "Heebo",sans-serif;background:none;border:0;color:var(--faint);cursor:pointer;padding:10px;text-decoration:underline}
@media(prefers-reduced-motion:reduce){.scan,.detail,.screen::after,.halo::before,.btn::after,img,.chip .dot,.check svg{animation:none!important}.notif,.toast{transition:none}}
@media(max-width:800px){.wrap{grid-template-columns:minmax(0,1fr)}.phone{max-width:400px;margin:0 auto}.side{order:-1}.side h1{font-size:48px}}
@media(max-width:600px){
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ground)}
.band{padding:0;height:100%}
.wrap{display:block;height:100%}
.side{display:none}
.phone{max-width:none;width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;padding:0;background:none;box-shadow:none}
.screen{border-radius:0}
.status{display:none}
.view{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.tabs{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px))}
.notif{top:calc(env(safe-area-inset-top,0px) + 8px)}
.dhead{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
.detail{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.toast{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
}
</style>
</head>

  {opacity:0,transform:'translateY(22px) scale(.97)',filter:'blur(8px)'},
  {opacity:1,transform:'translateY(-2px) scale(1.005)',filter:'blur(0)',offset:.75},
  {opacity:1,transform:'none',filter:'none'}
 ],{duration:560,delay:60+i*55,easing:'cubic-bezier(.25,.8,.35,1)',fill:'backwards'}));
}
function flowIn(prev){
 if(prev===null){stagger();return}
 if(calm.matches||prev===S.tab)return;
 stagger();
 const a=lensTarget(prev),b=lensTarget(S.tab);if(!a||!b)return;
 const dir=Math.sign(b.x-a.x);
 $('view').animate([
  {transform:`translateX(${dir*30}px)`},
  {transform:`translateX(${-dir*4}px)`,offset:.7},
  {transform:'none'}
 ],{duration:640,easing:'cubic-bezier(.22,.65,.25,1)'});
}
/* Liquid-glass lens under the active tab: it stretches toward the new tab,
   overshoots a little and settles. Dragging along the bar moves it with the finger. */
let lensAt=null;
const calm=matchMedia('(prefers-reduced-motion: reduce)');
function lensTarget(tab){const b=$('tabs').querySelector(`[data-tab="${tab}"]`);return b?{x:b.offsetLeft,w:b.offsetWidth}:null}
function placeLens(p){const L=$('tabs').querySelector('.lens');L.style.left=p.x+'px';L.style.width=p.w+'px'}
function moveLens(){
 const L=$('tabs').querySelector('.lens'),to=lensTarget(S.tab);if(!L||!to)return;
 const from=lensAt;lensAt=to;placeLens(to);
 if(!from||calm.matches||(from.x===to.x&&from.w===to.w)||!L.animate)return;
 const dir=Math.sign(to.x-from.x),dx=Math.abs(to.x-from.x);
 const mid={x:Math.min(from.x,to.x)+dx*.18,w:Math.max(from.w,to.w)+dx*.64};
 L.animate([
  {left:from.x+'px',width:from.w+'px',transform:'scale(1,1)'},
  {left:mid.x+'px',width:mid.w+'px',transform:'scale(1,.86)',offset:.38},
  {left:(to.x+dir*7)+'px',width:(to.w-4)+'px',transform:'scale(1,1.05)',offset:.72},
  {left:to.x+'px',width:to.w+'px',transform:'scale(1,1)'}
 ],{duration:560,easing:'cubic-bezier(.25,.8,.35,1)'});
}
(()=>{
 const bar=$('tabs');let drag=null;
 bar.addEventListener('pointerdown',e=>{drag={x0:e.clientX,on:false,id:e.pointerId}});
 bar.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.on){if(Math.abs(e.clientX-drag.x0)<8)return;drag.on=true;bar.classList.add('drag');bar.setPointerCapture(drag.id)}
  const r=bar.getBoundingClientRect(),w=lensAt.w,x=Math.max(6,Math.min(r.width-6-w,e.clientX-r.left-w/2));
  placeLens({x,w});
 });
 const end=e=>{
  if(!drag)return;const was=drag.on;drag=null;bar.classList.remove('drag');if(!was)return;
  const r=bar.getBoundingClientRect(),cx=e.clientX-r.left;
  let best=S.tab,bd=1e9;TABS.forEach(([k])=>{const t=lensTarget(k),d=Math.abs(t.x+t.w/2-cx);if(d<bd){bd=d;best=k}});
  lensAt={x:parseFloat(bar.querySelector('.lens').style.left),w:lensAt.w};
  if(best!==S.tab){S.tab=best;sel=null;$('view').scrollTop=0;save()}
  render();bar.dataset.dragged=Date.now();
 };
 bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);
 addEventListener('resize',()=>{lensAt=null;moveLens();liquidFilters()});
})();
function render(){
 sync();
 const bar=$('tabs');
 if(!bar.dataset.ready){bar.dataset.ready=1;bar.innerHTML='<span class="lens" aria-hidden="true"></span>'+TABS.map(([k,t,d])=>`<button data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${t}</button>`).join('')}
 bar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab));
 moveLens();
 if(!document.getElementById('lg-defs'))liquidFilters();
 const v=$('view'),y=v.scrollTop;
 v.innerHTML=S.tab==='today'?today():S.tab==='plants'?plants():S.tab==='add'?add():reminders();
 v.scrollTop=y;
 const prevTab=shownTab;shownTab=S.tab;flowIn(prevTab);
 const old=$('screen').querySelector('.detail');if(old)old.remove();
 if(sel)$('screen').insertAdjacentHTML('beforeend',detail());
}
function notify(){
 const open=S.plants.filter(p=>due(p)&&!S.done[p.id]),n=$('notif');
 const first=open[0];
 n.innerHTML=`<div class="nt"><img src="icons/icon-192.png" alt=""><span>ירוק בבית · עכשיו</span></div>
  <h3>${open.length?(S.remind.combine?`${open.length===1?'צמח אחד צמא':open.length+' צמחים צמאים'} היום`:`${esc(first.name)}: אני קצת צמא`):'אין משימות היום'}</h3>
  <p>${open.length?esc(S.remind.combine?open.map(p=>p.name).join(', '):'הגיע הזמן להשקות אותי'):'כל הצמחים מרגישים מצוין.'}</p>
  ${open.length?`<div class="cta"><button class="btn" data-nall>השקיתי${open.length>1&&S.remind.combine?' הכל':''}</button><button class="ghost" data-nlater>דחה למחר</button></div>`:''}`;
 const shots=S.plants.filter(p=>photoDue(p)&&!S.shot[p.id]);
 if(shots.length&&open.length)n.querySelector('p').insertAdjacentHTML('beforeend',`<br>📸 וגם יום צילום: ${esc(shots.map(p=>p.name).join(', '))}`);
 else if(shots.length){n.querySelector('h3').textContent='יום צילום 📸';n.querySelector('p').textContent=`הגיע הזמן לצלם את ${shots.map(p=>p.name).join(', ')} ולראות כמה ${shots.length>1?'הם גדלו':'הוא גדל'}`}
 if(S.remind.push&&open.length)systemNotify(n.querySelector('h3').textContent,n.querySelector('p').textContent);
 n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),8000);
}
async function systemNotify(title,body){
 try{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const reg=await navigator.serviceWorker?.getRegistration();
  const opts={body,icon:'icons/icon-192.png',badge:'icons/badge-96.png',tag:'daily',lang:'he',dir:'rtl'};
  if(reg)reg.showNotification(title,opts);else new Notification(title,opts);
 }catch(e){}
}
async function askPush(){
 if(window.yarokPush?.configured){
  const r=await window.yarokPush.enable({...pushPayload(),enabled:true});
  if(r==='ok'){toast('ההתראות הופעלו. התזכורת תגיע כל בוקר');return true}
  toast(r==='denied'?'לא ניתנה הרשאה להתראות':'הטלפון הזה לא תומך בהתראות. באייפון: קודם להוסיף למסך הבית');return false;
 }
 if(!('Notification' in window)){toast('הדפדפן הזה לא תומך בהתראות');return false}
 try{const r=await Notification.requestPermission();if(r==='granted'){toast('ההתראות הופעלו');return true}}catch(e){}
 toast('אין הרשאה להתראות במכשיר הזה');return false;
}
const closeN=()=>$('notif').classList.remove('show');
const openDue=()=>S.plants.filter(p=>due(p)&&!S.done[p.id]);

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab&&Date.now()-(+$('tabs').dataset.dragged||0)<300)return;
 if(d.tab){S.tab=d.tab;sel=null;$('view').scrollTop=0;save();render()}
 else if(d.seg){S.seg=d.seg;save();render()}
 else if(d.shoot){shoot(+d.shoot)}
 else if(d.unshot){const [pid,id]=d.unshot.split(':').map(Number);const a=PH[pid]||[];const i=a.findIndex(x=>x.id===id);if(i>-1){URL.revokeObjectURL(a[i].url);a.splice(i,1);dbDel(id);render();toast('התמונה נמחקה')}}
 else if(d.todo){const [id,i]=d.todo.split(':').map(Number);const a=S.todo[id]=S.todo[id]||[];a[i]=!a[i];save();render()}
 else if(d.w){sel=null;water(+d.w,'ok')}
 else if(d.wet)water(+d.wet,'wet');
 else if(d.later)water(+d.later,'later');
 else if(d.open){sel=+d.open;render()}
 else if('close' in d){sel=null;render()}
 else if(d.del){S.plants=S.plants.filter(p=>p.id!==+d.del);sel=null;save();render();toast('הצמח הוסר')}
 else if('take' in d)shoot('add');
 else if('gal' in d)shoot('add',true);
 else if('skip' in d){A.step='type';render()}
 else if(d.back){A.step=d.back;render()}
 else if(d.kind){A.kind=d.kind;A.step='details';render()}
 else if('addsave' in d)addPlant();
 else if('demo' in d)notify();
 else if('reset' in d)reset();
 else if('nall' in d){openDue().forEach(p=>{setLast(p,0);S.done[p.id]='ok'});closeN();save();render();toast(S.remind.shared?'סומן לכל בני הבית':'סומן כהושקה')}
 else if('nlater' in d){openDue().forEach(p=>{setLast(p,I(p).every-1);S.done[p.id]='later'});closeN();save();render();toast('נזכיר מחר ב-'+S.remind.time)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){A.q=e.target.value;$('kinds').innerHTML=catList(A.q)}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.r==='push'&&t.checked&&!(await askPush())){t.checked=false;return}if(t.dataset.r){S.remind[t.dataset.r]=t.checked;if(t.dataset.r==='push'&&!t.checked)window.yarokPush?.sync({...pushPayload(),enabled:false});save();render()}else if(t.id==='r-time'){S.remind.time=t.value;save()}});
$('t-notif').onclick=()=>{sel=null;S.tab='today';render();notify()};
$('t-add').onclick=()=>{sel=null;S.tab='add';A={step:'photo'};render()};
$('t-plant').onclick=()=>{sel=S.plants[0]?.id??null;render()};
const reset=()=>{S=fresh();sel=null;A={step:'photo'};save();render();toast('הדוגמה אופסה')};
$('t-reset').onclick=reset;
render();
$('cam').addEventListener('change',e=>onShot(e.target.files[0]));
$('gal').addEventListener('change',e=>onShot(e.target.files[0]));
loadPhotos();
setTimeout(()=>{if(openDue().length||S.plants.some(p=>photoDue(p)&&!S.shot[p.id]))notify()},1500);
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
