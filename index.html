<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ירוק בבית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="אפליקציה לטיפול בצמחי בית: משימות היום, זיהוי צמח מתמונה ותזכורות חכמות.">
<meta name="theme-color" content="#3d6a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ירוק בבית">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap">
<style>
/* VOICE everyday, warm, confident
   IDEA a greenhouse dashboard: a saturated leaf-green hero with one big number, glass panes over a sunlit jungle
   PICTURE the live phone app: hero number, stat pebbles, a glass capsule filling with liquid, real plant photos
   COLOUR mid leaf green ground, white glass at ~16%, lime #d4f36b for highlights, deep forest for contrast cards
   TYPE Heebo 800 for the big numbers, Heebo light/medium for text
   LAYOUT phone: hero block flush to the top with rounded bottom, then stacked cards; laptop: phone beside a glass panel */
:root{color-scheme:dark;--ground:#3d6a44;--ink:#f4fbef;--mute:rgba(244,251,239,.74);--faint:rgba(244,251,239,.5);--edge:rgba(255,255,255,.2);--lime:#d4f36b;--sage:#a9dc4c;--leaf:#d4f36b;--deep:#173a20;--forest:#1d3a25;--sun:#ffd86b;--sunfill:#ffd86b;--water:#a9dcff;--red:#ffab95;
 --rim:inset 0 0 0 1px rgba(255,255,255,.28),inset 1.5px 1.5px 1px -.5px rgba(255,255,255,.8),inset -1px -1px 1px -.5px rgba(255,255,255,.45),inset 0 -12px 20px -14px rgba(255,255,255,.25);
 --lift:0 16px 34px -18px rgba(8,30,12,.55);
 --spring:cubic-bezier(.3,1.6,.5,1);--vt:10px}
*{box-sizing:border-box;min-width:0}
html{background:var(--ground)}
body{background:linear-gradient(180deg,rgba(60,110,64,.35),rgba(30,70,38,.6)),url(img/bg.webp) center/cover fixed,var(--ground);min-height:100%;color:var(--ink);font:16px/1.55 "Heebo","Arial Hebrew",system-ui,sans-serif;overflow-x:clip;margin:0}
.band{padding-block:clamp(24px,4vw,56px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(24px,6vw,88px);align-items:center}
h1,h2,h3{line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance;font-weight:500}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-radius:28px;box-shadow:var(--rim),var(--lift)}
.glass:not(.tabs):not(.notif):not(.camhint){position:relative}
.ghost,.round,.check,.btn.alt,.try button{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 1.5px 1px rgba(255,255,255,.7),inset 0 -2px 4px rgba(0,0,0,.12),0 6px 14px -8px rgba(8,30,12,.5);border:0;color:var(--ink)}
button.glass,.btn,.ghost,.check,.round,.pill,.try button,.lp{transition:transform .5s var(--spring),background .25s,box-shadow .25s}
button.glass:active,.btn:active,.ghost:active,.check:active,.round:active,.pill:active,.try button:active,.lp:active{transform:scale(.94)}
.side{display:flex;flex-direction:column;gap:20px}
.side h1{font-size:clamp(44px,6vw,76px);font-weight:300;letter-spacing:-.03em}
.side h1 b{font-weight:800;display:block}
.side p{margin:0;max-width:46ch;color:var(--mute);font-size:17px}
.try{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:520px}
.try button{font:500 15px "Heebo",sans-serif;text-align:start;padding:12px 16px;border-radius:999px;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px}
.try svg{width:20px;height:20px;flex:none;color:var(--lime)}
.note{font-size:14px;color:var(--faint)}
/* phone */
.phone{position:relative;width:100%;aspect-ratio:9/19.2;max-height:840px;border-radius:50px;padding:9px;background:linear-gradient(145deg,rgba(255,255,255,.5),rgba(255,255,255,.12));box-shadow:0 40px 80px -30px rgba(5,25,10,.7),inset 0 0 0 1px rgba(255,255,255,.5)}
.screen{position:relative;height:100%;border-radius:42px;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
.screen::before{content:"";position:absolute;inset:-40px;background:linear-gradient(rgba(74,128,76,.5),rgba(38,82,46,.62)),url(img/bg.webp) center/cover;filter:blur(24px) saturate(1.25);z-index:-2}
.screen::after{content:"";position:absolute;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(30% 22% at 22% 30%,rgba(212,243,107,.28),transparent 70%),radial-gradient(28% 20% at 80% 62%,rgba(255,255,255,.22),transparent 70%),radial-gradient(28% 24% at 30% 90%,rgba(120,210,170,.25),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(6%,-4%) rotate(8deg)}100%{transform:translate(-5%,5%) rotate(-6deg)}}
.status{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 28px 4px;font:600 14px "Heebo",sans-serif;direction:ltr;pointer-events:none}
.status span:last-child{display:flex;gap:6px;align-items:center}
.status i{display:inline-block;width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.status i::after{content:"";position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1px}
.view{--vt:44px;flex:1;overflow-y:auto;padding:var(--vt) 18px 116px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view>*,.detail>*{flex-shrink:0}
.view svg,.detail svg{width:18px;height:18px;flex:none}
/* bottom bar: five slots, a floating + in the middle, an iridescent ring on the active tab */
.tabs{position:absolute;left:12px;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px;border-radius:999px;z-index:4;background:linear-gradient(160deg,rgba(40,80,48,.55),rgba(20,50,28,.55));-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:var(--rim),0 18px 36px -14px rgba(5,25,10,.7);touch-action:none;user-select:none;-webkit-user-select:none}
.tabs.refract{-webkit-backdrop-filter:url(#lg-bar) blur(8px) saturate(180%);backdrop-filter:url(#lg-bar) blur(8px) saturate(180%)}
.lens{position:absolute;top:6px;bottom:6px;left:6px;width:60px;border-radius:999px;pointer-events:none;z-index:0;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(2px) saturate(200%);backdrop-filter:blur(2px) saturate(200%);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 6px 16px -6px rgba(0,0,0,.4);transform-origin:center;transition:transform .5s var(--spring),opacity .3s}
.lens::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from 200deg,#ffb36b,#ff6fb5,#8f8bff,#6fe3ff,#d4f36b,#ffb36b);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tabs.refract .lens{-webkit-backdrop-filter:url(#lg-lens) saturate(200%);backdrop-filter:url(#lg-lens) saturate(200%)}
.tabs.drag .lens{transform:scale(1.22,1.16)}
.lens.off{opacity:0}
.tabs button{position:relative;z-index:1;transition:color .3s;border:0;background:none;color:var(--mute);font:500 12px "Heebo",sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;cursor:pointer;border-radius:20px;min-height:54px}
.tabs button[aria-current=true]{color:#fff}
.tabs svg{width:22px;height:22px}
.tabs .fab{justify-self:center;width:62px;height:62px;min-height:0;border-radius:50%;padding:0;display:grid;place-items:center;color:#fff;margin-block:-14px;background:radial-gradient(circle at 50% 35%,#4f9a4a,#2a6b31 70%);box-shadow:0 0 0 3px transparent,0 10px 22px -8px rgba(5,25,10,.8),inset 0 1.5px 1px rgba(255,255,255,.6);position:relative}
.tabs .fab::before{content:"";position:absolute;inset:-3px;border-radius:50%;padding:3px;background:conic-gradient(from 120deg,#ffb36b,#ff6fb5,#8f8bff,#6fe3ff,#d4f36b,#ffb36b);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:turn 6s linear infinite}
.tabs .fab svg{width:28px;height:28px;stroke-width:2.2}
.tabs .fab[aria-current=true]{background:radial-gradient(circle at 50% 35%,#e2f98c,#b6e04a 70%);color:var(--deep)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.view,.detail{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
/* page header for the other tabs */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h2{font-size:30px;font-weight:300}
.top h2 b{font-weight:800}
.top small{color:var(--mute);font-size:14px}
.halo{position:relative;flex:none;width:48px;height:48px;border-radius:16px;padding:2.5px;overflow:hidden;box-shadow:0 6px 16px -6px rgba(5,25,10,.6)}
.halo::before{content:"";position:absolute;inset:-30%;background:conic-gradient(#ffb36b,#ff6fb5,#8f8bff,#6fe3ff,#d4f36b,#ffb36b);animation:turn 7s linear infinite}
.halo img{position:relative;display:block;width:100%;height:100%;border-radius:14px}
.side .halo{width:76px;height:76px;padding:3px;border-radius:24px}
.side .halo img{border-radius:21px}
@keyframes turn{to{transform:rotate(1turn)}}
/* hero block, flush to the top of the screen */
.hero2{margin:calc(-1*var(--vt)) -18px 0;padding:calc(var(--vt) + 4px) 20px 20px;border-radius:0 0 38px 38px;background:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px) 0 0/16px 16px,radial-gradient(120% 80% at 80% 0%,#8fcb55,transparent 60%),linear-gradient(170deg,#5d9e45,#3c8040 55%,#2f6c37);box-shadow:inset 0 -1px 0 rgba(255,255,255,.35),0 20px 40px -20px rgba(5,25,10,.7);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero2::after{content:"";position:absolute;width:60%;aspect-ratio:1;left:-20%;bottom:-30%;border-radius:50%;background:radial-gradient(rgba(212,243,107,.35),transparent 65%);animation:glow 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:translate(30%,-20%) scale(1.2)}}
.hbar{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;direction:ltr;align-items:center;gap:10px;font:800 26px "Heebo",system-ui,sans-serif;letter-spacing:-.02em}
.brand i{color:var(--lime);font-style:normal}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start}
.chips span{font:500 13px "Heebo",sans-serif;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.kicker{font-size:14px;color:var(--mute)}
.bignum{display:flex;align-items:flex-end;gap:14px;line-height:.8}
.bignum b{font:800 clamp(96px,30vw,132px) "Heebo",sans-serif;letter-spacing:-.05em;line-height:.8;animation:countin .9s var(--spring)}
@keyframes countin{from{transform:translateY(24px) scale(.9);opacity:0}}
.bignum .tag{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:6px}
.bignum .tag span{background:var(--lime);color:var(--deep);font:800 18px "Heebo",sans-serif;padding:4px 10px;border-radius:6px}
.bignum .tag svg{width:26px;height:26px;color:var(--lime);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.lead{margin:0;font-size:19px;line-height:1.35;font-weight:400}
.lead b{font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px 16px;border-radius:24px;display:flex;flex-direction:column;gap:2px;text-align:start;border:0;color:var(--ink);font:inherit;cursor:pointer}
.stat.dark{background:linear-gradient(170deg,rgba(23,58,32,.75),rgba(23,58,32,.5));box-shadow:var(--rim),0 12px 24px -14px rgba(5,25,10,.8)}
.stat.lightg{background:linear-gradient(170deg,rgba(255,255,255,.3),rgba(255,255,255,.12));box-shadow:var(--rim),0 12px 24px -14px rgba(5,25,10,.6)}
.stat b{font:800 30px "Heebo",sans-serif;color:var(--lime);line-height:1.1}
.stat b small{font-size:15px;font-weight:600;margin-inline-start:4px;color:var(--ink)}
.stat span{font-size:13px;color:var(--mute)}
.banner{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:999px;background:linear-gradient(170deg,rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:inset 0 0 0 1.5px rgba(212,243,107,.55),0 12px 24px -14px rgba(5,25,10,.6)}
.banner .ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#eafba8,#c3e85a);color:var(--deep);box-shadow:inset 0 1.5px 1px #fff}
.banner .ico svg{width:22px;height:22px}
.banner div{flex:1}
.banner b{display:block;font-size:16px}
.banner small{color:var(--mute);font-size:13px}
.lp{border:0;cursor:pointer;font:700 15px "Heebo",sans-serif;padding:12px 20px;border-radius:999px;color:var(--deep);background:linear-gradient(180deg,#e6fb93,#c4e95a);box-shadow:inset 0 1.5px 1px #fff,inset 0 -2px 4px rgba(60,120,20,.25),0 8px 16px -8px rgba(60,120,20,.8);white-space:nowrap}
/* watering queue: every pot, most urgent first, each with a countdown ring */
.queue{display:flex;flex-direction:column;gap:10px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:26px}
.qrow.bad{box-shadow:var(--rim),inset 0 0 0 1.5px rgba(255,171,149,.6),var(--lift)}
.qmain{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);font:inherit;text-align:start;cursor:pointer;min-width:0}
.qmain img{width:52px;height:52px;flex:none;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(5,25,10,.35))}
.qmain span{display:flex;flex-direction:column;min-width:0}
.qmain b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmain small{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.cd small{font-size:11px;color:var(--mute);white-space:nowrap}
.ringc{position:relative;width:46px;height:46px}
.ringc svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringc .tr{fill:none;stroke:rgba(255,255,255,.14);stroke-width:5}
.ringc .pr{fill:none;stroke-width:5;stroke-linecap:round;stroke:var(--lime);animation:ringin 1s cubic-bezier(.25,.8,.3,1)}
@keyframes ringin{from{stroke-dasharray:0 200}}
.ringc b{position:absolute;inset:0;display:grid;place-items:center;font:800 17px "Heebo",sans-serif}
.qrow.warn .pr{stroke:var(--sun)}.qrow.warn .cd small{color:var(--sun)}
.qrow.bad .pr{stroke:var(--red)}.qrow.bad .cd small{color:var(--red);font-weight:600}
.qrow.bad .ringc .tr{stroke:rgba(255,171,149,.5);animation:beat 1.6s ease-in-out infinite;transform-origin:center}
.qact{display:flex;flex-direction:column;align-items:center;gap:4px}
.qact .check{width:40px;height:40px;color:var(--water)}
.mini-g{border:0;background:none;color:var(--mute);font:500 11px "Heebo",sans-serif;cursor:pointer;padding:0}
/* tip of the day */
.trip{padding:16px;display:flex;flex-direction:column;gap:12px}
.trip .row{display:flex;justify-content:space-between;align-items:center}
.trip h3{font-size:17px;font-weight:800}
.tripf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tsum div{padding:10px 4px;border-radius:18px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tsum b{display:block;font:800 26px "Heebo",sans-serif;color:var(--lime);line-height:1.1}
.tsum small{font-size:12px;color:var(--mute)}
.tstep{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tstep>span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 14px "Heebo",sans-serif;color:var(--deep);background:linear-gradient(180deg,#e6fb93,#c4e95a)}
.tstep b{display:block;font-size:15px}
.tstep small{display:block;color:var(--mute);font-size:13px;line-height:1.45;margin-top:2px}
.tstep i{font-style:normal;color:var(--ink);font-weight:600;margin-inline-end:4px}
a.btn.alt{text-decoration:none;font-size:20px}
input[type=date]{font:16px "Heebo",sans-serif}
.quote{padding:22px 20px 20px;border-radius:30px;background:linear-gradient(160deg,#28503a,#1b3a28);box-shadow:inset 0 0 0 1px rgba(212,243,107,.25),inset 0 1px 0 rgba(255,255,255,.2),0 18px 34px -18px rgba(5,25,10,.8);position:relative;overflow:hidden}
.quote::before{content:"”";position:absolute;top:-34px;left:14px;font:800 120px "Heebo",sans-serif;color:rgba(255,255,255,.08)}
.quote small{color:var(--lime);font-weight:600;font-size:13px}
.quote p{margin:8px 0 0;font-size:21px;font-weight:700;line-height:1.35}
/* capsule of liquid: share of healthy plants */
.capsule{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:16px;align-items:center;padding:18px 20px;border-radius:30px;background:linear-gradient(160deg,rgba(23,58,32,.7),rgba(23,58,32,.45));box-shadow:var(--rim),var(--lift)}
.capsule small{color:var(--mute);font-size:14px}
.capsule .pct{font:800 64px "Heebo",sans-serif;line-height:1;letter-spacing:-.03em;margin:4px 0 10px}
.tube{position:relative;width:92px;height:190px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),inset 4px 6px 8px -4px rgba(255,255,255,.6),inset -6px -10px 14px -8px rgba(0,0,0,.4),0 16px 30px -12px rgba(0,0,0,.6)}
.tube .liquid{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#d4f36b,#79c34a);transition:height 1.2s var(--spring);animation:fillup 1.4s cubic-bezier(.25,.8,.3,1)}
@keyframes fillup{from{height:0}}
.tube .liquid svg{position:absolute;bottom:100%;left:0;width:200%;height:14px;margin-bottom:-1px;animation:wave 3s linear infinite;color:#d4f36b}
@keyframes wave{to{transform:translateX(-50%)}}
.tube::after{content:"";position:absolute;top:10px;left:16px;width:14px;height:60%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
.tube .bub{position:absolute;bottom:8px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.7);animation:bub 4s ease-in infinite}
@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px "Heebo",sans-serif;padding:6px 11px;border-radius:999px;white-space:nowrap}
.chip.ok{background:rgba(212,243,107,.18);color:var(--lime)}
.chip.warn{background:rgba(255,216,107,.18);color:var(--sun)}
.chip.bad{background:rgba(255,171,149,.18);color:var(--red)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.bad .dot{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.6);opacity:.6}}
.sec{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;font-weight:700}
.sec button{background:none;border:0;color:var(--lime);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:4px 18px 8px;scroll-padding-inline:18px;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 128px;scroll-snap-align:start;padding:8px 8px 12px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px}
.mini img{width:100%;height:112px;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(5,25,10,.35))}

 'my-pothos-water':{sp:'פוטוס מגוון (ייחור במים)',lat:"Epipremnum aureum 'Marble Queen'",every:7,act:'החלפת מים',light:'בהיר עקיף',temp:'17–30°',hum:'40–60%',health:['ok','מוכן לשתילה'],

/* Trip mode: water everything right before leaving, then a dated plan for whoever stays home */
const iso=t=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dOf=x=>{const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const fmtD=x=>new Date(dOf(x)).toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'});
function tripNow(){
 const t=S.trip;if(!t||!t.on)return '';
 const today=dayStart(),from=dOf(t.from),to=dOf(t.to);
 if(today===from-DAY||today===from&&new Date().getHours()<12)return 'before';
 if(today>=from&&today<to)return 'away';
 return '';
}
function tripPlan(){
 const t=S.trip,from=dOf(t.from),to=dOf(t.to),days=Math.max(1,Math.round((to-from)/DAY));
 const visits={},fine=[],help=[];
 S.plants.forEach(p=>{
  const ev=I(p).every;
  if(ev>=days){fine.push(p);return}
  help.push(p);
  for(let d=from+ev*DAY;d<to;d+=ev*DAY){const k=iso(d);(visits[k]=visits[k]||[]).push(p)}
 });
 return {days,fine,help,visits:Object.entries(visits).sort()};
}
function tripText(){
 const t=S.trip,P=tripPlan();
 return `היי${t.helper?' '+t.helper:''} 🌿\nאני בחופשה מ-${fmtD(t.from)} עד ${fmtD(t.to)}. תודה שאת/ה עוזר/ת עם הצמחים!\n\n`+
  (P.visits.length?P.visits.map(([d,L])=>`${fmtD(d)}:\n`+L.map(p=>`• ${p.name} (${p.room}) – ${act(p)==='השקיה'?'להשקות':'להחליף מים'}`).join('\n')).join('\n\n'):'אין צורך להשקות, הכל יסתדר לבד 🙂')+
  (P.fine.length?`\n\nלא צריך לגעת: ${P.fine.map(p=>p.name).join(', ')}`:'')+`\n\n— נשלח מ-Yarok`;
}

  <div class="tstep"><span>1</span><div><b>${fmtD(iso(dOf(t.from)-DAY))}, יום לפני</b><small>להשקות היטב את כולם ולמלא את הבקבוקים. התזכורת תגיע לבד.</small></div></div>
  ${P.visits.length?`<div class="tstep"><span>2</span><div><b>${t.helper?esc(t.helper)+' משקה':'מישהו צריך להשקות'}</b>${P.visits.map(([d,L])=>`<small><i>${fmtD(d)}</i> ${esc(L.map(p=>p.name).join(', '))}</small>`).join('')}</div></div>`:`<div class="tstep"><span>2</span><div><b>לא צריך עזרה</b><small>הנסיעה קצרה מספיק, כל הצמחים יחזיקו.</small></div></div>`}
  <div class="tstep"><span>${P.visits.length?3:3}</span><div><b>טיפים</b><small>לקבץ את הצמחים הצמאים יחד הרחק מהשמש הישירה של המרפסת, ומגש עם חלוקים ומים מתחתם. לבזיליקום אפשר לנעוץ בקבוק מים הפוך באדמה.</small></div></div>
  ${P.visits.length?`<div class="cta"><button class="btn" data-trip="share">שלח את התוכנית${t.helper?' ל'+esc(t.helper):''}</button><a class="btn alt" href="https://wa.me/?text=${encodeURIComponent(tripText())}" target="_blank" rel="noopener" aria-label="שלח בוואטסאפ">💬</a></div>`:''}
 </div>`;
}
function reminders(){
 const R=S.remind,sw=(k,t,s)=>`<label class="set glass" for="r-${k}"><div><b>${t}</b><small>${s}</small></div><input type="checkbox" class="sw" id="r-${k}" data-r="${k}" ${R[k]?'checked':''}></label>`;
 return `<div class="top"><h2><b>תזכורות</b></h2></div>
 <div class="set glass"><div><b>תזכורת יומית</b><small>כל המשימות של היום בהתראה אחת</small></div><input type="time" id="r-time" value="${R.time}"></div>
 ${sw('push','התראות בטלפון','התראה אמיתית במכשיר. באייפון, אחרי הוספה למסך הבית')}
 ${sw('photo','תזכורת לצלם','כל שבועיים, כדי לראות את הצמחים גדלים')}
 ${sw('combine','התראה מרוכזת','במקום התראה נפרדת לכל צמח')}
 ${sw('weather','התראות מזג אוויר','גל חום, קרה או רוח חזקה במרפסת')}
 ${sw('shared','משותף לבית','כשמישהו משקה, התזכורת נעלמת לכולם')}
 ${tripCard()}
 <button class="btn" data-demo>הצג תזכורת לדוגמה</button>
 <button class="small" data-reset>אפס את נתוני הדוגמה</button>`;
}
const TABS=[['today','היום','M4 11l8-7 8 7v9H4zM10 20v-5h4v5'],['plants','הצמחים','M12 21V11C12 6 8 4 4 4c0 5 3 7 8 7zm0 0c0-4 3-7 8-7 0 4-3 7-8 7z'],['add','הוספה','M12 5v14M5 12h14'],['photos','תמונות','M4 8h3l2-3h6l2 3h3v11H4zM12 16.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z'],['remind','תזכורות','M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4']];
/* Liquid Glass refraction. A displacement map shaped like the pill bends the
   backdrop near the rim, the way thick glass does. Chromium can feed an SVG
   filter to backdrop-filter; Safari keeps the frosted fallback. */
const canRefract=/Chrome\//.test(navigator.userAgent)&&!/iPhone|iPad|iPod/.test(navigator.userAgent);
function pillMap(w,h,bezel){
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),im=g.createImageData(w,h),r=h/2;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const qx=Math.max(r,Math.min(w-r,x+.5)),vx=x+.5-qx,vy=y+.5-r,len=Math.hypot(vx,vy)||1,d=r-len;
  let dx=0,dy=0;if(d<bezel&&d>-1){const t=1-Math.max(0,d)/bezel,m=t*t;dx=-vx/len*m;dy=-vy/len*m}
  const i=(y*w+x)*4;im.data[i]=128+dx*127;im.data[i+1]=128+dy*127;im.data[i+2]=128;im.data[i+3]=255;
 }
 g.putImageData(im,0,0);return c.toDataURL();
}
function liquidFilters(){
 if(!canRefract)return;
 const bar=$('tabs'),L=bar.querySelector('.lens');if(!L)return;
 const mk=(id,w,h,bezel,scale)=>`<filter id="${id}" x="0" y="0" width="${w}" height="${h}" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feImage href="${pillMap(w,h,bezel)}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="none" result="m"/><feDisplacementMap in="SourceGraphic" in2="m" scale="${scale}" xChannelSelector="R" yChannelSelector="G"/></filter>`;
 const bw=Math.round(bar.offsetWidth),bh=Math.round(bar.offsetHeight),lw=Math.round(L.offsetWidth)||80,lh=Math.round(L.offsetHeight)||52;
 let svg=document.getElementById('lg-defs');
 if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='lg-defs';svg.setAttribute('width','0');svg.setAttribute('height','0');svg.style.position='absolute';document.body.appendChild(svg)}
 svg.innerHTML=mk('lg-bar',bw,bh,Math.min(18,bh*.4),26)+mk('lg-lens',lw,lh,Math.min(16,lh*.45),34);
 bar.classList.add('refract');
}
/* the new screen flows in from the side of the tab you moved toward, sharpening as it lands */
let shownTab=null;
function stagger(){
 if(calm.matches)return;
 [...$('view').children].slice(0,9).forEach((c,i)=>c.animate([
  {opacity:0,transform:'translateY(22px) scale(.97)',filter:'blur(8px)'},
  {opacity:1,transform:'translateY(-2px) scale(1.005)',filter:'blur(0)',offset:.75},
  {opacity:1,transform:'none',filter:'none'}
 ],{duration:560,delay:60+i*55,easing:'cubic-bezier(.25,.8,.35,1)',fill:'backwards'}));
}
function flowIn(prev){
 if(prev===null){stagger();return}
 if(calm.matches||prev===S.tab)return;
 stagger();
 const a=lensTarget(prev),b=lensTarget(S.tab);if(!a||!b)return;
 const dir=Math.sign(b.x-a.x);
 $('view').animate([
  {transform:`translateX(${dir*30}px)`},
  {transform:`translateX(${-dir*4}px)`,offset:.7},
  {transform:'none'}
 ],{duration:640,easing:'cubic-bezier(.22,.65,.25,1)'});
}
/* Liquid-glass lens under the active tab: it stretches toward the new tab,
   overshoots a little and settles. Dragging along the bar moves it with the finger. */
let lensAt=null;
const calm=matchMedia('(prefers-reduced-motion: reduce)');
function lensTarget(tab){const b=$('tabs').querySelector(`[data-tab="${tab}"]`);return b?{x:b.offsetLeft,w:b.offsetWidth}:null}
function placeLens(p){const L=$('tabs').querySelector('.lens');L.style.left=p.x+'px';L.style.width=p.w+'px'}
function moveLens(){
 const L=$('tabs').querySelector('.lens');if(!L)return;L.classList.toggle('off',S.tab==='add');if(S.tab==='add')return;
 const to=lensTarget(S.tab);if(!to)return;
 const from=lensAt;lensAt=to;placeLens(to);
 if(!from||calm.matches||(from.x===to.x&&from.w===to.w)||!L.animate)return;
 const dir=Math.sign(to.x-from.x),dx=Math.abs(to.x-from.x);
 const mid={x:Math.min(from.x,to.x)+dx*.18,w:Math.max(from.w,to.w)+dx*.64};
 L.animate([
  {left:from.x+'px',width:from.w+'px',transform:'scale(1,1)'},
  {left:mid.x+'px',width:mid.w+'px',transform:'scale(1,.86)',offset:.38},
  {left:(to.x+dir*7)+'px',width:(to.w-4)+'px',transform:'scale(1,1.05)',offset:.72},
  {left:to.x+'px',width:to.w+'px',transform:'scale(1,1)'}
 ],{duration:560,easing:'cubic-bezier(.25,.8,.35,1)'});
}
(()=>{
 const bar=$('tabs');let drag=null;
 bar.addEventListener('pointerdown',e=>{drag={x0:e.clientX,on:false,id:e.pointerId}});
 bar.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.on){if(Math.abs(e.clientX-drag.x0)<8)return;drag.on=true;bar.classList.add('drag');bar.setPointerCapture(drag.id)}
  const r=bar.getBoundingClientRect(),w=lensAt.w,x=Math.max(6,Math.min(r.width-6-w,e.clientX-r.left-w/2));
  placeLens({x,w});
 });
 const end=e=>{
  if(!drag)return;const was=drag.on;drag=null;bar.classList.remove('drag');if(!was)return;
  const r=bar.getBoundingClientRect(),cx=e.clientX-r.left;
  let best=S.tab,bd=1e9;TABS.forEach(([k])=>{const t=lensTarget(k),d=Math.abs(t.x+t.w/2-cx);if(d<bd){bd=d;best=k}});
  lensAt={x:parseFloat(bar.querySelector('.lens').style.left),w:lensAt.w};
  if(best!==S.tab){S.tab=best;sel=null;$('view').scrollTop=0;save()}
  render();bar.dataset.dragged=Date.now();
 };
 bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);
 addEventListener('resize',()=>{lensAt=null;moveLens();liquidFilters()});
})();
function render(){
 sync();
 const bar=$('tabs');
 if(!bar.dataset.ready){bar.dataset.ready=1;bar.innerHTML='<span class="lens" aria-hidden="true"></span>'+TABS.map(([k,t,d])=>k==='add'?`<button data-tab="add" class="fab" aria-label="${t}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="${d}"/></svg></button>`:`<button data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${t}</button>`).join('')}
 bar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab));
 moveLens();
 if(!document.getElementById('lg-defs'))liquidFilters();
 const v=$('view'),y=v.scrollTop;
 v.innerHTML=S.tab==='today'?today():S.tab==='plants'?plants():S.tab==='add'?add():S.tab==='photos'?gallery():reminders();
 v.scrollTop=y;
 const prevTab=shownTab;shownTab=S.tab;flowIn(prevTab);
 const old=$('screen').querySelector('.detail');if(old)old.remove();
 if(sel)$('screen').insertAdjacentHTML('beforeend',detail());
}
function notify(){
 if(tripNow()==='before'){const n=$('notif');n.innerHTML=`<div class="nt"><img src="icons/icon-192.png" alt=""><span>Yarok · עכשיו</span></div><h3>מחר יוצאים ✈️</h3><p>להשקות היום היטב את כל ${S.plants.length} הצמחים ולמלא את הבקבוקים.</p><div class="cta"><button class="btn" data-nall>השקיתי הכל</button></div>`;n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),9000);return}
 const open=S.plants.filter(p=>due(p)&&!S.done[p.id]),n=$('notif');
 const first=open[0];
 n.innerHTML=`<div class="nt"><img src="icons/icon-192.png" alt=""><span>ירוק בבית · עכשיו</span></div>
  <h3>${open.length?(S.remind.combine?`${open.length===1?'צמח אחד צמא':open.length+' צמחים צמאים'} היום`:`${esc(first.name)}: אני קצת צמא`):'אין משימות היום'}</h3>
  <p>${open.length?esc(S.remind.combine?open.map(p=>p.name).join(', '):'הגיע הזמן להשקות אותי'):'כל הצמחים מרגישים מצוין.'}</p>
  ${open.length?`<div class="cta"><button class="btn" data-nall>השקיתי${open.length>1&&S.remind.combine?' הכל':''}</button><button class="ghost" data-nlater>דחה למחר</button></div>`:''}`;
 const shots=S.plants.filter(p=>photoDue(p)&&!S.shot[p.id]);
 if(shots.length&&open.length)n.querySelector('p').insertAdjacentHTML('beforeend',`<br>📸 וגם יום צילום: ${esc(shots.map(p=>p.name).join(', '))}`);
 else if(shots.length){n.querySelector('h3').textContent='יום צילום 📸';n.querySelector('p').textContent=`הגיע הזמן לצלם את ${shots.map(p=>p.name).join(', ')} ולראות כמה ${shots.length>1?'הם גדלו':'הוא גדל'}`}
 if(S.remind.push&&open.length)systemNotify(n.querySelector('h3').textContent,n.querySelector('p').textContent);
 n.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>n.classList.remove('show'),8000);
}
async function systemNotify(title,body){
 try{
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const reg=await navigator.serviceWorker?.getRegistration();
  const opts={body,icon:'icons/icon-192.png',badge:'icons/badge-96.png',tag:'daily',lang:'he',dir:'rtl'};
  if(reg)reg.showNotification(title,opts);else new Notification(title,opts);
 }catch(e){}
}
async function askPush(){
 if(window.yarokPush?.configured){
  const r=await window.yarokPush.enable({...pushPayload(),enabled:true});
  if(r==='ok'){toast('ההתראות הופעלו. התזכורת תגיע כל בוקר');return true}
  toast(r==='denied'?'לא ניתנה הרשאה להתראות':'הטלפון הזה לא תומך בהתראות. באייפון: קודם להוסיף למסך הבית');return false;
 }
 if(!('Notification' in window)){toast('הדפדפן הזה לא תומך בהתראות');return false}
 try{const r=await Notification.requestPermission();if(r==='granted'){toast('ההתראות הופעלו');return true}}catch(e){}
 toast('אין הרשאה להתראות במכשיר הזה');return false;
}
const closeN=()=>$('notif').classList.remove('show');
const openDue=()=>S.plants.filter(p=>due(p)&&!S.done[p.id]);

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.tab&&Date.now()-(+$('tabs').dataset.dragged||0)<300)return;
 if(d.tab){S.tab=d.tab;sel=null;$('view').scrollTop=0;save();render()}
 else if(d.seg){S.seg=d.seg;save();render()}
 else if(d.shoot){shoot(+d.shoot)}
 else if(d.unshot){const [pid,id]=d.unshot.split(':').map(Number);const a=PH[pid]||[];const i=a.findIndex(x=>x.id===id);if(i>-1){URL.revokeObjectURL(a[i].url);a.splice(i,1);dbDel(id);render();toast('התמונה נמחקה')}}
 else if(d.todo){const [id,i]=d.todo.split(':').map(Number);const a=S.todo[id]=S.todo[id]||[];a[i]=!a[i];save();render()}
 else if(d.w){sel=null;water(+d.w,'ok')}
 else if(d.wet)water(+d.wet,'wet');
 else if(d.later)water(+d.later,'later');
 else if(d.open){sel=+d.open;render()}
 else if('close' in d){sel=null;render()}
 else if(d.del){S.plants=S.plants.filter(p=>p.id!==+d.del);sel=null;save();render();toast('הצמח הוסר')}
 else if('take' in d)shoot('add');
 else if('gal' in d)shoot('add',true);
 else if('skip' in d){A.step='type';render()}
 else if(d.back){A.step=d.back;render()}
 else if(d.kind){A.kind=d.kind;A.step='details';render()}
 else if('addsave' in d)addPlant();
 else if(d.trip==='on'){const f=dayStart()+7*DAY;S.trip={on:true,from:iso(f),to:iso(f+7*DAY),helper:S.trip?.helper||''};save();render()}
 else if(d.trip==='off'){S.trip={...S.trip,on:false};save();render();toast('מצב חופשה בוטל')}
 else if(d.trip==='share'){const txt=tripText();if(navigator.share)navigator.share({text:txt}).catch(()=>{});else navigator.clipboard?.writeText(txt).then(()=>toast('התוכנית הועתקה')).catch(()=>toast('לא הצלחתי להעתיק'))}
 else if('demo' in d)notify();
 else if('reset' in d)reset();
 else if('nall' in d){(tripNow()==='before'?S.plants:openDue()).forEach(p=>{setLast(p,0);S.done[p.id]='ok'});closeN();save();render();toast(S.remind.shared?'סומן לכל בני הבית':'סומן כהושקה')}
 else if('nlater' in d){openDue().forEach(p=>{setLast(p,I(p).every-1);S.done[p.id]='later'});closeN();save();render();toast('נזכיר מחר ב-'+S.remind.time)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){A.q=e.target.value;$('kinds').innerHTML=catList(A.q)}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='t-from'||t.id==='t-to'||t.id==='t-helper'){S.trip[t.id.slice(2)]=t.value;if(dOf(S.trip.to)<=dOf(S.trip.from))S.trip.to=iso(dOf(S.trip.from)+DAY);save();render();return}if(t.dataset.r==='push'&&t.checked&&!(await askPush())){t.checked=false;return}if(t.dataset.r){S.remind[t.dataset.r]=t.checked;if(t.dataset.r==='push'&&!t.checked)window.yarokPush?.sync({...pushPayload(),enabled:false});save();render()}else if(t.id==='r-time'){S.remind.time=t.value;save()}});
$('t-notif').onclick=()=>{sel=null;S.tab='today';render();notify()};
$('t-add').onclick=()=>{sel=null;S.tab='add';A={step:'photo'};render()};
$('t-plant').onclick=()=>{sel=S.plants[0]?.id??null;render()};
const reset=()=>{S=fresh();sel=null;A={step:'photo'};save();render();toast('הדוגמה אופסה')};
$('t-reset').onclick=reset;
render();
$('cam').addEventListener('change',e=>onShot(e.target.files[0]));
$('gal').addEventListener('change',e=>onShot(e.target.files[0]));
loadPhotos();
setTimeout(()=>{if(openDue().length||S.plants.some(p=>photoDue(p)&&!S.shot[p.id]))notify()},1500);
if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
